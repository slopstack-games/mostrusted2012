# The browser build (tools/web/build) published to GitHub Pages. Run by hand only (Actions → "Browser build to
# GitHub Pages" → Run workflow). The page holds only our code: the game files are read from the player's own
# install folder in the browser and never uploaded. Needs Settings → Pages → Source: "GitHub Actions".
name: Browser build to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: "Rust nightly for the threaded wasm build (std is rebuilt with atomics)"
        default: "nightly-2026-11-14"
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rust-src

      # The whole wasm target dir is cached, not only the dependencies (Swatinem/rust-cache keeps only crates named
      # in Cargo.lock: it dropped the std that `-Z build-std` rebuilds, so every dependency was rebuilt each run).
      # Keyed by toolchain + Cargo.lock, newest commit first; a partial match restores the closest older one.
      - name: Restore the cargo registry and the wasm build
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/wasm-threads
          key: web-${{ inputs.toolchain }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            web-${{ inputs.toolchain }}-${{ hashFiles('Cargo.lock') }}-
            web-${{ inputs.toolchain }}-

      # The CLI must match the `wasm-bindgen` crate in Cargo.lock.
      - name: wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129

      - name: Build
        env:
          WEB_TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          # A module restored by the cache must not stand in for a failed build.
          rm -f target/wasm-threads/wasm32-unknown-unknown/release/mostrusted.wasm
          tools/web/build
          test -f target/web/pkg/mostrusted_bg.wasm
          test -f target/web/coi-sw.js

      # Saved even when the build failed (the dependencies built so far are kept); our own crates' artifacts are
      # dropped first: checkout gives their sources new mtimes, so cargo rebuilds them anyway.
      - name: Save the cargo registry and the wasm build
        if: always() && steps.cache.outputs.cache-hit != 'true'
        run: |
          d=target/wasm-threads/wasm32-unknown-unknown/release
          rm -rf $d/deps/*mostrusted* $d/deps/*mw_* $d/.fingerprint/mostrusted-* $d/.fingerprint/mw-* $d/build/mostrusted-* $d/build/mw-* $d/incremental
      - if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/wasm-threads
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
