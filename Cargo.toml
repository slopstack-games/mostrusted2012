[workspace]
resolver = "3"
members = ["crates/*"]
# Patched upstream crates ([patch.crates-io] below): not workspace members.
exclude = ["third_party"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Toemmsen96/mostrusted2012"

[workspace.dependencies]
mw-gamedir = { path = "crates/mw-gamedir" }
mw-bundle = { path = "crates/mw-bundle" }
mw-formats = { path = "crates/mw-formats" }
mw-assets = { path = "crates/mw-assets" }
mw-logic = { path = "crates/mw-logic" }
mw-lua = { path = "crates/mw-lua" }
mw-handling = { path = "crates/mw-handling" }
mw-audio = { path = "crates/mw-audio" }
anyhow = "1"
thiserror = "2"
flate2 = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1

# Upstream crates carried with small patches for the browser build's audio (third_party/README.md): the mixer
# runs on cpal's AudioWorklet thread, and no lock in its path may block there.
[patch.crates-io]
bevy_audio = { path = "third_party/bevy_audio" }
rodio = { path = "third_party/rodio" }
