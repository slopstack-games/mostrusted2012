[package]
name = "mostrusted"
description = "Most Rusted: an open-source runtime for NFS Most Wanted (2012), built on Bevy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mw-gamedir.workspace = true
mw-bundle.workspace = true
mw-formats.workspace = true
mw-assets.workspace = true
mw-handling.workspace = true
anyhow.workspace = true
clap.workspace = true
rayon.workspace = true
bevy = { version = "0.19", features = ["free_camera", "dfg_lut", "bluenoise_texture"] }
avian3d = "0.7"
# The Steam Controller is read from its HID interface (steam_controller.rs); pure-Rust backends, no C build.
hidapi = { version = "2.6", default-features = false, features = ["linux-native", "windows-native"] }
mw-audio.workspace = true

# The browser build (crate::platform): threads as Web Workers over shared memory, the clock for seeds.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm_thread = "0.3.3"
js-sys = "0.3.106"
