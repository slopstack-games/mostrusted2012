[package]
name = "mw-gamedir"
description = "Locates and validates an installed copy of NFS Most Wanted (2012)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true

# The browser's picked folder (WebSource): blob URLs read with synchronous range requests.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = ["Blob", "File", "FileList", "Url", "Window", "XmlHttpRequest", "XmlHttpRequestResponseType"] }
